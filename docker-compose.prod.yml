services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    init: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundpad
      POSTGRES_USER: soundpad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundpad -d soundpad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://soundpad:${POSTGRES_PASSWORD}@db:5432/soundpad
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.production}
      FRONTEND_ORIGIN: ${PUBLIC_BASE_URL}
      FRONTEND_ORIGINS: ${PUBLIC_BASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      YOUTUBE_TEMP_TTL_HOURS: ${YOUTUBE_TEMP_TTL_HOURS:-24}
      YOUTUBE_COOKIES_FILE: ${YOUTUBE_COOKIES_FILE:-}
      YOUTUBE_PO_TOKEN_PROVIDER_URL: http://pot-provider:4416
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      pot-provider:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
      SECONDARY_DOMAIN: ${SECONDARY_DOMAIN:-secondary.invalid}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
