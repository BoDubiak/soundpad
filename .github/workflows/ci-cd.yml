name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check backend syntax
        run: python -m compileall -q backend/app

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy to OVH
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: soundpad-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/soundpad_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/soundpad_deploy ~/.ssh/known_hosts

      - name: Upload application
        run: |
          rsync -az --delete \
            --exclude .git/ \
            --exclude .env \
            --exclude .env.production \
            --exclude backend/.env \
            --exclude backend/.venv/ \
            --exclude backend/uploads/ \
            --exclude frontend/node_modules/ \
            --exclude frontend/dist/ \
            -e "ssh -i ~/.ssh/soundpad_deploy" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/soundpad/"

      - name: Rebuild and restart production
        run: |
          ssh -i ~/.ssh/soundpad_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/soundpad && docker compose -p soundpad --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 180'

      - name: Show service status
        if: always()
        run: |
          ssh -i ~/.ssh/soundpad_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/soundpad && docker compose -p soundpad --env-file .env.production -f docker-compose.prod.yml ps'
